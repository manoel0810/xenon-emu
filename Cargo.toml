[package]
name = "xenon-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
byteorder = "1.5.0"
cbc = "0.2.1"
hmac = "0.13.0"
minifb = "0.29.0"
ms-compress = "0.2.1"
